name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci || npm install

      # Library sources only. `tsconfig.examples.json` additionally covers the
      # showcase and basic-app examples — not published, but they are the first
      # code a new user runs, so they must not silently break.
      - name: Typecheck (library)
        run: npm run typecheck

      - name: Typecheck (library + examples)
        run: npx tsc --noEmit -p tsconfig.examples.json

      - name: Typecheck (website)
        run: npx tsc --noEmit -p website/tsconfig.json

      # Includes the architecture boundary tests, which fail if anything under
      # src/components starts reading a store or registry.
      - name: Test (library)
        run: npm test

      # Renders every site route and asserts every demo region still resolves,
      # which a bundle-only build would not catch.
      - name: Test (website)
        run: npm run site:test

      - name: Build library
        run: npm run build

      # Theme blocks live in the native `nexus.themes` layer, not Tailwind's
      # `@layer base`, precisely so Tailwind can't tree-shake them — a theme
      # class is only ever applied at runtime, so nothing references it
      # literally. This asserts they survived the build.
      - name: Check every theme reached the built stylesheet
        run: node scripts/check-themes-bundled.mjs

      # Every rule must be inside a `nexus.*` cascade layer, the no-reset
      # variant must exist, and the JS bundles must not import CSS.
      - name: Check the stylesheets are layered
        run: node scripts/check-css.mjs

      - name: Build Storybook
        run: npm run build-storybook

      - name: Build site
        run: npm run site:build

      # zustand is a peer dependency (^4.5 || ^5), so consumers dedupe to their
      # own copy. Prove the library works on the other major too.
      - name: Test against zustand 5
        run: npm install --no-save zustand@5 && npm test
