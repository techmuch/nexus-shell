<!doctype html>
<html lang="en" class="theme-light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Shell — React 19 Components for IDE-Style Applications</title>
    <meta
      name="description"
      content="A React 19 component library for building IDE-style desktop & web applications: menu bar, activity bar, docking layout, graph editor, property panel, terminal, chat pane, and status bar."
    />
    <meta property="og:title" content="Nexus Shell — React 19 Components for IDE-Style Applications" />
    <meta
      property="og:description"
      content="Build modern IDE-style applications with React 19 & TypeScript. Includes workspace shell, node graph editor, multi-select property panel, terminal, chat, and docking layout."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://techmuch.github.io/nexus-shell/" />
    <meta property="og:site_name" content="Nexus Shell" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nexus Shell — React 19 Components for IDE-Style Applications" />
    <meta name="twitter:description" content="React components for building IDE-style applications: workspace shell, graph editor, property panel, terminal, chat pane, and status bar." />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('nexus-site-theme') || 'dark';
          document.documentElement.className = 'theme-' + t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
